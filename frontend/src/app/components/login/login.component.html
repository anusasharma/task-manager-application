<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <h1>TaskFlow</h1>
    </div>

    <div class="login-error" *ngIf="error">{{ error }}</div>

    <div class="login-field">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" placeholder="you@example.com" />
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input id="password" type="password" [(ngModel)]="password" (keydown.enter)="login()" placeholder="Your password" />
    </div>

    <button class="login-button" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>

    <p class="login-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
